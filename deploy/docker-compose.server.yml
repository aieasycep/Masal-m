# Masalım — tek sunucu canlı ortamı (Ubuntu VPS, 57.129.6.57).
#
# Bu sunucuda BAŞKA projeler de nginx (host) üzerinden yayında — 80/443 nginx'te
# kalır. Masalım servisleri yalnızca 127.0.0.1'e açılır ve host nginx'i üç
# sanal sunucu ile önlerine geçer (deploy/nginx-masalim.conf):
#   api.57-129-6-57.sslip.io     → 127.0.0.1:8801 (api)
#   storage.57-129-6-57.sslip.io → 127.0.0.1:8802 (minio)
#   admin.57-129-6-57.sslip.io   → 127.0.0.1:8803 (admin)
#
# Sunucuda /opt/masalim düzeni:
#   /opt/masalim/app            → repo kopyası (deploy workflow rsync'ler)
#   /opt/masalim/.env           → üretilmiş sırlar (deploy/remote-setup.sh yazar)
#   /opt/masalim/providers.env  → AI sağlayıcı anahtarları (GitHub Secrets'tan
#                                 her dağıtımda yazılır)
#
# Çalıştırma (deploy workflow'un yaptığı):
#   docker compose -f /opt/masalim/app/deploy/docker-compose.server.yml \
#     --project-directory /opt/masalim up -d --build

name: masalim

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - /opt/masalim/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masalim -d masalim"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    env_file:
      - /opt/masalim/.env
    ports:
      - "127.0.0.1:8802:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Tek seferlik: masalim-media bucket'ını oluşturur (varsa dokunmaz).
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - /opt/masalim/.env
    entrypoint: /bin/sh
    command: -c 'mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing local/masalim-media'

  api:
    build:
      context: /opt/masalim/app
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - /opt/masalim/.env
      - /opt/masalim/providers.env
    ports:
      - "127.0.0.1:8801:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  admin:
    build:
      context: /opt/masalim/app
      dockerfile: deploy/admin.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.57-129-6-57.sslip.io
    restart: unless-stopped
    ports:
      - "127.0.0.1:8803:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  minio-data:
