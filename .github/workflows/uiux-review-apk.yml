name: UIUX Review APK

# Builds the SIDE-BY-SIDE review build of the app from the uiux-review branch.
# The review identity (display name + applicationId suffix) is applied to
# app.json ONLY inside the runner, so the git-tracked identity stays byte-
# identical to the stable app and can never leak into production via a merge.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "API adresi (boş = canlı test API'si)"
        required: false
        default: ""
  push:
    branches: [uiux-review]
    paths:
      - ".github/workflows/uiux-review-apk.yml"
      - "apps/mobile/**"
      - "patches/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url != '' && inputs.api_url || 'https://masalim-api-z6ry.onrender.com' }}
      EXPO_PUBLIC_PURCHASES_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (mobile dependencies)
        run: pnpm turbo build --filter='@masalim/mobile^...'

      - name: Apply review identity (runner-only, never committed)
        working-directory: apps/mobile
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("app.json", "utf8"));
            cfg.expo.name = "Kendi Hikayem — UI/UX Review";
            cfg.expo.android.package = "com.masalim.app.uiuxreview";
            fs.writeFileSync("app.json", JSON.stringify(cfg, null, 2));
          '
          grep -E '"name"|"package"' app.json

      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Raise Gradle JVM memory (dex merge OOMs at the template's 2g heap)
        working-directory: apps/mobile/android
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g/' gradle.properties
          grep '^org.gradle.jvmargs=' gradle.properties

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK for review handoff
        run: |
          mkdir -p review-out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk review-out/KendiHikayem-UIUX-Review.apk

      - name: Upload review APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kendihikayem-uiux-review-apk
          path: review-out/KendiHikayem-UIUX-Review.apk
          retention-days: 14

  # Every review APK is emulator-verified in the same run (APP_ALIVE +
  # player smoke on the review package) — no separate dispatch needed.
  smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PKG: com.masalim.app.uiuxreview
    steps:
      - name: Download review APK artifact
        uses: actions/download-artifact@v4
        with:
          name: kendihikayem-uiux-review-apk
          path: apk

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch review app in emulator and capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r apk/KendiHikayem-UIUX-Review.apk
            adb shell pm list packages | grep uiuxreview || echo "PACKAGE NOT FOUND"
            adb logcat -c || true
            adb shell monkey -p $PKG -c android.intent.category.LAUNCHER 1
            sleep 45
            adb logcat -d > logcat-full.txt
            if adb shell pidof $PKG > /dev/null 2>&1; then echo "APP_ALIVE=yes" | tee app-alive.txt; else echo "APP_ALIVE=no (process died)" | tee app-alive.txt; fi
            adb logcat -c || true
            adb shell am start -W -a android.intent.action.VIEW -d "masalim://debug/player-smoke" $PKG || echo "deep link start failed"
            sleep 30
            adb logcat -d > logcat-smoke.txt
            if adb shell pidof $PKG > /dev/null 2>&1; then echo "SMOKE_ALIVE=yes" | tee smoke-alive.txt; else echo "SMOKE_ALIVE=no (process died)" | tee smoke-alive.txt; fi

      - name: Upload full logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-crash-logcat
          path: |
            logcat-full.txt
            app-alive.txt
            logcat-smoke.txt
            smoke-alive.txt
          retention-days: 14

      # Keep this step LAST so the distilled verdict sits at the end of the log.
      - name: Extract crash summary
        if: always()
        run: |
          echo "================ APP ALIVE? ================"
          cat app-alive.txt || true
          echo "================ FATAL EXCEPTION (startup) ================"
          grep -n -B 2 -A 120 "FATAL EXCEPTION" logcat-full.txt || echo "no FATAL EXCEPTION found"
          echo "================ ReactNativeJS errors (startup) ================"
          grep -n "ReactNativeJS" logcat-full.txt | tail -n 80 || true
          echo "================ PLAYER SMOKE ALIVE? ================"
          cat smoke-alive.txt || true
          echo "================ PLAYER SMOKE markers ================"
          grep -n "player-smoke" logcat-smoke.txt | tail -n 60 || echo "no player-smoke markers found"
          echo "================ FATAL EXCEPTION (player smoke) ================"
          grep -n -B 2 -A 160 "FATAL EXCEPTION" logcat-smoke.txt || echo "no FATAL EXCEPTION found"
          echo "================ AndroidRuntime lines (player smoke) ================"
          grep -n "AndroidRuntime" logcat-smoke.txt | tail -n 80 || true
