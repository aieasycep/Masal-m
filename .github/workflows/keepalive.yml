name: Keep API Awake

# Render's free tier spins the API down after ~15 min without traffic; the next
# request then eats a 1-1.5 min cold boot. Pinging /health on a schedule keeps
# the test deployment warm. GitHub cron is best-effort — runs can drift to
# ~12-15 min apart, so an occasional cold start is still possible.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health (one retry for cold starts)
        run: |
          url="https://masalim-api-z6ry.onrender.com/health"
          curl -fsS --max-time 90 "$url" || { sleep 15; curl -fsS --max-time 90 "$url"; }
